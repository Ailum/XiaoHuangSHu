server:
  port: 8000

spring:
  application:
    name: xiaohuangshu-gateway
  profiles:
    active: dev
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 10s
  config:
    import: optional:nacos:xiaohuangshu-gateway.yaml
  cloud:
    nacos:
      config:
        server-addr: 127.0.0.1:8848
        group: DEFAULT_GROUP
        file-extension: yaml
        refresh-enabled: true
        prefix: ${spring.application.name}
        namespace: xiaohuangshu
      discovery:
        enabled: true
        group: DEFAULT_GROUP
        namespace: xiaohuangshu
        server-addr: 127.0.0.1:8848
    gateway:
      routes:
        - id: auth
          uri: lb://xiaohuangshu-auth
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1
        - id: user
          uri: lb://xiaohuangshu-user
          predicates:
              - Path=/user/**
          filters:
              - StripPrefix=1
        - id: note
          uri: lb://xiaohuangshu-note
          predicates:
          - Path=/note/**
          filters:
          - StripPrefix=1



############## Sa-Token 配置 (文档: https://sa-token.cc) ##############
sa-token:
  # token 名称（同时也是 cookie 名称）
  token-name: Authorization
  # token 有效期（单位：秒） 默认30天，-1 代表永久有效
  timeout: 2592000
  # token 最低活跃频率（单位：秒），如果 token 超过此时间没有访问系统就会被冻结，默认-1 代表不限制，永不冻结
  active-timeout: -1
  # 是否允许同一账号多地同时登录 （为 true 时允许一起登录, 为 false 时新登录挤掉旧登录）
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个 token （为 true 时所有登录共用一个 token, 为 false 时每次登录新建一个 token）
  is-share: true
  # token 风格（默认可取值：uuid、simple-uuid、random-32、random-64、random-128、tik）
  token-style: random-128
  # 是否输出操作日志
  is-log: true
  # token前缀
  token-prefix: Bearer
